name: Research runner diagnostic

on:
  push:
    branches:
      - research/generic-course-pipeline
    paths:
      - ".github/workflows/research-runner-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runner-smoke-test:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Confirm runner starts
        run: |
          echo "GitHub-hosted runner started successfully"
          date -u
          uname -a
      - name: Confirm Python runtime
        run: |
          python --version
          python -c "import sys; print(sys.executable)"
