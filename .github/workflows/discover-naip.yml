name: Discover Lake Arlington NAIP imagery

on:
  workflow_dispatch:
  push:
    branches:
      - feature/hybrid-course-intelligence-foundation
    paths:
      - "scripts/discover_lake_arlington_naip.py"
      - ".github/workflows/discover-naip.yml"

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests

      - name: Query NAIP catalog for Lake Arlington
        run: python scripts/discover_lake_arlington_naip.py

      - name: Upload imagery candidate metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lake-arlington-naip-candidates
          path: artifacts/lake_arlington_naip_candidates.json
          if-no-files-found: warn
          retention-days: 14
