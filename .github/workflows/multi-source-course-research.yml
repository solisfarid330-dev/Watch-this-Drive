name: Multi-source course data research checks

on:
  push:
    branches:
      - feature/in-app-course-recovery
    paths:
      - "research/multi_source_course_audit.py"
      - "research/test_multi_source_course_audit.py"
      - ".github/workflows/multi-source-course-research.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test source matching and NAIP request construction
        run: python -m unittest discover -s research -p "test_multi_source_course_audit.py" -v
