name: Texture classifier validation
on:
  push:
    branches: [research/generic-course-pipeline]
    paths:
      - "research/naip_texture_classifier.py"
      - "research/test_naip_texture_classifier.py"
      - ".github/workflows/texture-classifier-validation.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: texture-classifier-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check Pillow numpy scipy scikit-learn
      - name: Run classifier regression tests
        run: python -m unittest research/test_naip_texture_classifier.py -v
      - name: Train and evaluate South Padre Hole 1
        run: |
          python research/naip_texture_classifier.py \
            --train-geojson research/results/south-padre/features.geojson \
            --train-metadata research/results/south-padre/aerial-validation/hole-1-validation.json \
            --train-tiff research/results/south-padre/aerial-validation/hole-1-naip-2022-rgbir.tif \
            --target-geojson research/results/south-padre/features.geojson \
            --target-metadata research/results/south-padre/aerial-validation/hole-1-validation.json \
            --target-tiff research/results/south-padre/aerial-validation/hole-1-naip-2022-rgbir.tif \
            --out research/results/south-padre/aerial-validation/hole-1-texture-classifier
      - name: Test transfer to South Padre Hole 2
        run: |
          python research/naip_texture_classifier.py \
            --train-geojson research/results/south-padre/features.geojson \
            --train-metadata research/results/south-padre/aerial-validation/hole-1-validation.json \
            --train-tiff research/results/south-padre/aerial-validation/hole-1-naip-2022-rgbir.tif \
            --target-geojson research/results/south-padre/features.geojson \
            --target-metadata research/results/south-padre/aerial-validation/hole-2-validation.json \
            --target-tiff research/results/south-padre/aerial-validation/hole-2-naip-2022-rgbir.tif \
            --target-hole-ref 2 \
            --out research/results/south-padre/aerial-validation/hole-2-texture-classifier
      - name: Test transfer to Westwood
        run: |
          python research/naip_texture_classifier.py \
            --train-geojson research/results/south-padre/features.geojson \
            --train-metadata research/results/south-padre/aerial-validation/hole-1-validation.json \
            --train-tiff research/results/south-padre/aerial-validation/hole-1-naip-2022-rgbir.tif \
            --target-geojson research/results/westwood/features.geojson \
            --target-metadata research/results/westwood/aerial-validation/hole-1-validation.json \
            --target-tiff research/results/westwood/aerial-validation/hole-1-naip-2022-rgbir.tif \
            --out research/results/westwood/aerial-validation/hole-1-texture-classifier
      - name: Test transfer to sparsely mapped Cottonwood
        run: |
          python research/naip_texture_classifier.py \
            --train-geojson research/results/south-padre/features.geojson \
            --train-metadata research/results/south-padre/aerial-validation/hole-1-validation.json \
            --train-tiff research/results/south-padre/aerial-validation/hole-1-naip-2022-rgbir.tif \
            --target-geojson research/results/cottonwood-creek/features.geojson \
            --target-metadata research/results/cottonwood-creek/aerial-validation/hole-1-validation.json \
            --target-tiff research/results/cottonwood-creek/aerial-validation/hole-1-naip-2022-rgbir.tif \
            --out research/results/cottonwood-creek/aerial-validation/hole-1-texture-classifier
      - name: Commit experiment outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/results/*/aerial-validation/*-texture-classifier
          if git diff --cached --quiet; then
            echo "No classifier outputs changed."
          else
            git commit -m "Update multi-scale texture classifier validation outputs"
            git push
          fi
