name: Course data integration experiment
# Read-only source extraction; generated research snapshots are committed to this isolated branch.

on:
  push:
    branches:
      - research/generic-course-pipeline
    paths:
      - "research/course_data_audit.py"
      - ".github/workflows/course-data-integration.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  retrieve-course-data:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run South Padre Island Golf Club extraction
        id: south-padre
        continue-on-error: true
        run: |
          python research/course_data_audit.py \
            --course "South Padre Island Golf Club" \
            --location "Laguna Vista, Texas, USA" \
            --out output/south-padre
      - name: Run independent second-course extraction
        id: second-course
        continue-on-error: true
        run: |
          python research/course_data_audit.py \
            --course "Cottonwood Creek Country Club" \
            --location "Harlingen, Texas, USA" \
            --out output/cottonwood-creek
      - name: Preserve source snapshots in research branch
        if: steps.south-padre.outcome == 'success' && steps.second-course.outcome == 'success'
        run: |
          mkdir -p research/results/south-padre research/results/cottonwood-creek
          cp output/south-padre/source-response.json research/results/south-padre/
          cp output/south-padre/inventory-report.json research/results/south-padre/
          cp output/south-padre/features.geojson research/results/south-padre/
          cp output/cottonwood-creek/source-response.json research/results/cottonwood-creek/
          cp output/cottonwood-creek/inventory-report.json research/results/cottonwood-creek/
          cp output/cottonwood-creek/features.geojson research/results/cottonwood-creek/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/results/
          if git diff --cached --quiet; then
            echo "No changes to research snapshots."
          else
            git commit -m "Store two-course OSM extraction snapshots"
            git fetch origin research/generic-course-pipeline
            git rebase origin/research/generic-course-pipeline
            git push
          fi
      - name: Summarize extraction outcomes
        if: always()
        run: |
          echo "South Padre extraction outcome: \${{ steps.south-padre.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Cottonwood Creek extraction outcome: \${{ steps.second-course.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          if [ -f output/south-padre/inventory-report.json ]; then
            echo "## South Padre Island Golf Club" >> "$GITHUB_STEP_SUMMARY"
            jq -r '.inventory.counts_by_golf_tag | to_entries[] | "- \(.key): \(.value)"' output/south-padre/inventory-report.json >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f output/cottonwood-creek/inventory-report.json ]; then
            echo "## Cottonwood Creek Country Club" >> "$GITHUB_STEP_SUMMARY"
            jq -r '.inventory.counts_by_golf_tag | to_entries[] | "- \(.key): \(.value)"' output/cottonwood-creek/inventory-report.json >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "Successful extraction confirms data retrieval, not geometric accuracy." >> "$GITHUB_STEP_SUMMARY"
      - name: Check both course extractions
        if: always()
        run: |
          test "\${{ steps.south-padre.outcome }}" = "success"
          test "\${{ steps.second-course.outcome }}" = "success"
