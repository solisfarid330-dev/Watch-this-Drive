name: Research pipeline checks

on:
  push:
    branches:
      - research/generic-course-pipeline
    paths:
      - "research/**"
      - ".github/workflows/research-pipeline.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile research prototypes
        run: python -m py_compile research/*.py
      - name: Run offline unit tests
        run: python -m unittest discover -s research -p "test_*.py" -v

      - name: Audit endpoint associations on all saved course snapshots
        run: |
          mkdir -p association-audits
          for course in south-padre westwood cottonwood-creek; do
            python research/hole_feature_association.py \
              --geojson "research/results/$course/features.geojson" \
              --out "association-audits/$course-hole-association-audit.json"
          done

      - name: Summarize course-wide marker exclusivity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in sorted(Path("association-audits").glob("*.json")):
              report = json.loads(path.read_text())
              summary = {}
              for marker in ("tee", "green", "pin"):
                  unique = sum(len(h["endpoint_marker_candidates"][marker]["course_wide_unique_candidates"]) for h in report["holes"])
                  ambiguous = sum(len(h["endpoint_marker_candidates"][marker]["ambiguous_shared_candidates"]) for h in report["holes"])
                  excluded = sum(len(h["endpoint_marker_candidates"][marker]["closer_to_another_hole"]) for h in report["holes"])
                  summary[marker] = {"unique_candidates": unique, "ambiguous_shared": ambiguous, "closer_to_other_hole": excluded}
              print(json.dumps({"course": path.stem, "holes": report["hole_count"], "markers": summary}, sort_keys=True))
          PY

      - name: Upload association audit reports
        uses: actions/upload-artifact@v4
        with:
          name: course-hole-association-audits
          path: association-audits/*.json
          if-no-files-found: error
