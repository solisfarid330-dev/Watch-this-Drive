name: Build Android APK

on:
  push:
    branches: [ main, 'feature/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install geometry-only artwork dependencies
        if: github.ref_name == 'feature/course-hole-artwork-generation'
        run: python -m pip install --disable-pip-version-check pillow shapely pyproj

      - name: Generate Lake Arlington hole artwork from OpenStreetMap
        if: github.ref_name == 'feature/course-hole-artwork-generation'
        run: |
          python scripts/render_osm_course_artwork.py \
            --course-element-type way \
            --course-element-id 412547640 \
            --course-name "Lake Arlington Golf Course" \
            --out-dir build/lake-arlington-artwork

      - name: Package Lake Arlington artwork into APK assets
        if: github.ref_name == 'feature/course-hole-artwork-generation'
        run: |
          python scripts/package_course_hole_artwork.py \
            --source build/lake-arlington-artwork \
            --destination app/src/main/assets/course_holes \
            --element-type way \
            --element-id 412547640 \
            --course-name "Lake Arlington Golf Course"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        env:
          MAPTILER_API_KEY: ${{ secrets.MAPTILER_API_KEY }}
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: watch-this-drive-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            build/lake-arlington-artwork/
            app/src/main/assets/course_holes/way-412547640/
          if-no-files-found: error
          retention-days: 14
