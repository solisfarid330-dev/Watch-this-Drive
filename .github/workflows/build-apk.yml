name: Build Android APK

on:
  push:
    branches: [ main, 'feature/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Download and verify OpenGolfAPI offline course catalog
        run: |
          mkdir -p app/src/main/assets
          curl --fail --location --retry 3 \
            https://github.com/opengolfapi/data/releases/download/v2.1.0/opengolfapi-us.geojson.gz \
            -o app/src/main/assets/opengolfapi-us.geojson.gz
          sha256sum app/src/main/assets/opengolfapi-us.geojson.gz
          gzip --test app/src/main/assets/opengolfapi-us.geojson.gz
          echo "c3b3bd4b1b3894fe5b9a6f0e84df43472f55aaad2602faeb58ef56a709db1a39  app/src/main/assets/opengolfapi-us.geojson.gz" | sha256sum --check
          actual_geojson_sha=$(gzip --decompress --stdout app/src/main/assets/opengolfapi-us.geojson.gz | sha256sum | cut -d ' ' -f 1)
          test "$actual_geojson_sha" = "fb4aa24aa8bce2fe338812bc316a2067720c6ffb7874429f5c037b31578300db"

      - name: Build debug APK
        env:
          MAPTILER_API_KEY: ${{ secrets.MAPTILER_API_KEY }}
        run: gradle --no-daemon testDebugUnitTest assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: watch-this-drive-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
