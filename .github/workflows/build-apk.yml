name: Build Android APK

on:
  push:
    branches: [ main, 'feature/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Rapid feature-branch commits should validate the newest tree, not queue
# several expensive Android builds for superseded intermediate commits.
concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download and verify OpenGolfAPI offline catalog
        run: bash scripts/download_opengolf_catalog.sh

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        env:
          MAPTILER_API_KEY: ${{ secrets.MAPTILER_API_KEY }}
        run: gradle --no-daemon testDebugUnitTest assembleDebug

      - name: Verify offline course catalog is packaged
        run: |
          apk="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          unzip -l "$apk" | grep -q "assets/opengolfapi-us.geojson"
          catalog_sha=$(unzip -p "$apk" assets/opengolfapi-us.geojson | sha256sum | cut -d ' ' -f 1)
          test "$catalog_sha" = "fb4aa24aa8bce2fe338812bc316a2067720c6ffb7874429f5c037b31578300db"
          unzip -p "$apk" assets/COURSE_DATA_ATTRIBUTION.txt | grep -q "OpenGolfAPI"
          sha256sum "$apk"

      # Normal CI runs keep a short-lived artifact. A manual run also publishes
      # a prerelease asset, which is separate from Actions artifact storage.
      - name: Upload APK artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: watch-this-drive-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 1

      - name: Publish installable test APK
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-build-${{ github.run_number }}
          name: Watch this Drive test build ${{ github.run_number }}
          prerelease: true
          generate_release_notes: false
          files: app/build/outputs/apk/debug/app-debug.apk
          body: |
            Automated Android debug build for testing.
            Built from commit ${{ github.sha }}.
            Unit tests and offline course catalog packaging checks ran before publication.
