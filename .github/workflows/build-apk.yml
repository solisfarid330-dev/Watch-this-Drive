name: Build Android APK

on:
  push:
    branches: [ main, 'feature/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download and verify OpenGolfAPI offline catalog
        run: bash scripts/download_opengolf_catalog.sh

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        env:
          MAPTILER_API_KEY: ${{ secrets.MAPTILER_API_KEY }}
        run: gradle --no-daemon testDebugUnitTest assembleDebug

      - name: Verify offline course catalog is packaged
        run: |
          echo "Source assets:"
          find app/src/main/assets -maxdepth 1 -type f -printf '%p %s bytes\\n'
          echo "Build asset directories:"
          find app/build -type d -iname '*asset*' -print
          echo "Catalog copies in build outputs:"
          find app/build -type f -name 'opengolfapi-us.geojson.gz' -printf '%p %s bytes\\n'
          apk="app/build/outputs/apk/debug/app-debug.apk"
          echo "Packaged APK assets:"
          unzip -l "$apk" | grep 'assets/' || true
          unzip -l "$apk" | grep -q "assets/opengolfapi-us.geojson"
          catalog_sha=$(unzip -p "$apk" assets/opengolfapi-us.geojson | sha256sum | cut -d ' ' -f 1)
          test "$catalog_sha" = "fb4aa24aa8bce2fe338812bc316a2067720c6ffb7874429f5c037b31578300db"
          unzip -p "$apk" assets/COURSE_DATA_ATTRIBUTION.txt | grep -q "OpenGolfAPI"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: watch-this-drive-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 3
        # The Android build and tests are the required CI checks. GitHub may
        # reject artifact uploads when the repository storage quota is full;
        # report that as an upload warning rather than a false build failure.
        continue-on-error: true
