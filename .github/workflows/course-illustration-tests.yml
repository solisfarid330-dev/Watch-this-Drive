name: Course illustration engine tests

on:
  push:
    branches:
      - feature/course-hole-artwork-generation
    paths:
      - "scripts/course_intelligence/**"
      - "scripts/package_course_hole_artwork.py"
      - "tests/test_*.py"
      - ".github/workflows/course-illustration-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install geometry and image dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy shapely pyproj rasterio pillow
      - name: Run generic course intelligence tests
        run: PYTHONPATH=. python -m unittest discover -s tests -v
