name: Aerial geometry validation
on:
  push:
    branches: [research/generic-course-pipeline]
    paths:
      - "research/aerial_validation.py"
      - ".github/workflows/aerial-hole-validation.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: aerial-validation-\${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check Pillow
      - name: South Padre Hole 1 imagery and overlay
        run: python research/aerial_validation.py --geojson research/results/south-padre/features.geojson --hole-ref 1 --out research/results/south-padre/aerial-validation
      - name: Westwood Hole 1 imagery and overlay
        run: python research/aerial_validation.py --geojson research/results/westwood/features.geojson --hole-ref 1 --out research/results/westwood/aerial-validation
      - name: Commit imagery and overlays
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/results/south-padre/aerial-validation research/results/westwood/aerial-validation
          git commit -m "Add NAIP aerial overlays for two-course hole validation" || echo "No new imagery outputs"
          git push
