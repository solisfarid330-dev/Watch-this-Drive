name: Research branch Android validation

on:
  push:
    branches:
      - research/generic-course-pipeline
    paths:
      - "app/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/research-android-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    name: Compile Android app
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out research branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compile debug APK
        env:
          MAPTILER_API_KEY: ${{ secrets.MAPTILER_API_KEY }}
        run: gradle --no-daemon clean assembleDebug


  parser-unit-tests:
    name: Parser tests (no emulator required)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out research branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Run parser unit tests
        run: gradle --no-daemon testDebugUnitTest
