name: Research branch Android validation

on:
  push:
    branches:
      - research/generic-course-pipeline
    paths:
      - "app/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/research-android-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Compile Android app
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out research branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compile debug APK
        env:
          MAPTILER_API_KEY: ${{ secrets.MAPTILER_API_KEY }}
        run: gradle --no-daemon clean assembleDebug

      - name: Upload research debug APK
        uses: actions/upload-artifact@v4
        with:
          name: watch-this-drive-research-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  parser-instrumentation-tests:
    name: Parser tests on Android emulator
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out research branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Run parser instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim
          script: gradle --no-daemon connectedDebugAndroidTest
